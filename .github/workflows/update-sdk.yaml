name: Update SDK

# Pulls the Exoscale OpenAPI spec, and when it differs from the snapshot in
# .github/openapi/exoscale.json, has Claude implement the changes and opens a pull request.
#
# Needs the CLAUDE_CODE_OAUTH_TOKEN secret, from `claude setup-token`.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

permissions:
  contents: write
  pull-requests: write

env:
  SPEC_URL: https://community.exoscale.com/reference/api/exoscale-openapi-spec.json
  SPEC_PATH: .github/openapi/exoscale.json
  BRANCH: update-sdk

jobs:
  update:
    name: Update the SDK to the latest API spec
    # The macOS runner image comes with Swift and SwiftFormat installed.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Pull the spec
        id: spec
        run: |
          curl -sSfL "$SPEC_URL" | jq -S . > "$RUNNER_TEMP/spec.json"
          if cmp -s "$RUNNER_TEMP/spec.json" "$SPEC_PATH"; then
            echo "The spec hasn't changed."
            exit 0
          fi
          # An open pull request may already cover this version of the spec.
          if git fetch -q --depth 1 origin "$BRANCH" 2>/dev/null &&
            git show "FETCH_HEAD:$SPEC_PATH" | cmp -s - "$RUNNER_TEMP/spec.json"; then
            echo "The $BRANCH branch already has this version of the spec."
            exit 0
          fi
          cp "$RUNNER_TEMP/spec.json" "$SPEC_PATH"
          git diff --stat
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Install SwiftLint
        if: steps.spec.outputs.changed
        run: brew install swiftlint

      - name: Implement the changes
        if: steps.spec.outputs.changed
        uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8 # v1.0.250
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # Keeps "Generated with Claude Code" and co-author lines out of anything Claude writes.
          settings: '{"attribution": {"commit": "", "pr": ""}}'
          claude_args: >-
            --model claude-opus-5-5
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git diff:*),Bash(git status:*),Bash(jq:*),Bash(swift build:*),Bash(swift test:*),Bash(swiftlint:*),Bash(swiftformat:*)"
          prompt: |
            The Exoscale OpenAPI spec has changed. The new version is in ${{ env.SPEC_PATH }},
            and `git diff -- ${{ env.SPEC_PATH }}` shows what changed since the SDK last matched it.

            Update the SDK so that it matches the new spec, following AGENTS.md:
            add, change or remove the methods and models the diff affects, and add or update
            their tests. Ignore changes that don't affect the SDK, such as reworded descriptions
            or examples, unless a doc comment repeats them.

            When you're done, `swift test`, `swiftlint lint --strict` and `swiftformat --lint .`
            must pass. Don't commit, push or open a pull request.

            Finally, write pull-request.md: a pull request description listing each change in the
            spec and what you did about it, including anything you deliberately left out and why.
            Don't mention Claude or add any attribution line.
            If nothing in the diff affects the SDK, say so and change no source files.

      - name: Open a pull request
        if: steps.spec.outputs.changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: ${{ env.BRANCH }}
          add-paths: |
            ${{ env.SPEC_PATH }}
            Sources
            Tests
            README.md
          commit-message: "feat: update to the latest Exoscale API spec"
          title: "feat: update to the latest Exoscale API spec"
          body-path: pull-request.md
          delete-branch: true
